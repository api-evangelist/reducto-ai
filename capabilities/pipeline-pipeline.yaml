naftiko: 1.0.0-alpha2
info:
  label: Reducto Pipeline API — Pipeline
  description: 'Reducto Pipeline API — Pipeline. 2 operations covering synchronous and asynchronous pipeline
    execution. Composes Parse, Split, Extract, and Edit into a single multi-step workflow with chained outputs.'
  tags:
  - Reducto
  - Pipeline
  - Workflows
  - Document AI
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    REDUCTO_API_KEY: REDUCTO_API_KEY
capability:
  consumes:
  - type: http
    namespace: pipeline-pipeline
    baseUri: https://platform.reducto.ai
    description: Reducto Pipeline API — Pipeline business capability. Self-contained, no shared references.
    resources:
    - name: pipeline
      path: /pipeline
      operations:
      - name: runpipeline
        method: POST
        description: Reducto Run Pipeline
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: pipeline-async
      path: /pipeline_async
      operations:
      - name: runpipelineasync
        method: POST
        description: Reducto Run Pipeline Async
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    authentication:
      type: bearer
      value: '{{env.REDUCTO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: pipeline-pipeline-rest
    port: 8080
    description: REST adapter for Reducto Pipeline API — Pipeline.
    resources:
    - path: /v1/pipeline
      name: pipeline
      operations:
      - method: POST
        name: runpipeline
        call: pipeline-pipeline.runpipeline
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/pipeline_async
      name: pipeline-async
      operations:
      - method: POST
        name: runpipelineasync
        call: pipeline-pipeline.runpipelineasync
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: pipeline-pipeline-mcp
    port: 9090
    transport: http
    description: MCP adapter for Reducto Pipeline API — Pipeline.
    tools:
    - name: reducto-pipeline
      description: Reducto Run Pipeline
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: pipeline-pipeline.runpipeline
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: reducto-pipeline-async
      description: Reducto Run Pipeline Async
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: pipeline-pipeline.runpipelineasync
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
