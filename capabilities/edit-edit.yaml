naftiko: 1.0.0-alpha2
info:
  label: Reducto Edit API — Edit
  description: 'Reducto Edit API — Edit. 2 operations covering synchronous and asynchronous edit. Fills detected
    blanks, tables, and checkboxes inside documents from a provided form schema without per-document templates.'
  tags:
  - Reducto
  - Edit
  - Forms
  - Document AI
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    REDUCTO_API_KEY: REDUCTO_API_KEY
capability:
  consumes:
  - type: http
    namespace: edit-edit
    baseUri: https://platform.reducto.ai
    description: Reducto Edit API — Edit business capability. Self-contained, no shared references.
    resources:
    - name: edit
      path: /edit
      operations:
      - name: editdocument
        method: POST
        description: Reducto Edit Document
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: edit-async
      path: /edit_async
      operations:
      - name: editdocumentasync
        method: POST
        description: Reducto Edit Document Async
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    authentication:
      type: bearer
      value: '{{env.REDUCTO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: edit-edit-rest
    port: 8080
    description: REST adapter for Reducto Edit API — Edit.
    resources:
    - path: /v1/edit
      name: edit
      operations:
      - method: POST
        name: editdocument
        call: edit-edit.editdocument
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/edit_async
      name: edit-async
      operations:
      - method: POST
        name: editdocumentasync
        call: edit-edit.editdocumentasync
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: edit-edit-mcp
    port: 9090
    transport: http
    description: MCP adapter for Reducto Edit API — Edit.
    tools:
    - name: reducto-edit
      description: Reducto Edit Document
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: edit-edit.editdocument
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: reducto-edit-async
      description: Reducto Edit Document Async
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: edit-edit.editdocumentasync
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
