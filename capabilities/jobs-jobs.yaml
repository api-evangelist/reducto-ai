naftiko: 1.0.0-alpha2
info:
  label: Reducto Jobs API — Jobs
  description: 'Reducto Jobs API — Jobs. 3 operations covering retrieve, cancel, and list async jobs created
    by parse_async, extract_async, split_async, edit_async, and pipeline_async.'
  tags:
  - Reducto
  - Jobs
  - Async
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    REDUCTO_API_KEY: REDUCTO_API_KEY
capability:
  consumes:
  - type: http
    namespace: jobs-jobs
    baseUri: https://platform.reducto.ai
    description: Reducto Jobs API — Jobs business capability. Self-contained, no shared references.
    resources:
    - name: job
      path: /job/{job_id}
      operations:
      - name: getjob
        method: GET
        description: Reducto Get Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: job_id
          in: path
          type: string
          required: true
    - name: cancel
      path: /cancel/{job_id}
      operations:
      - name: canceljob
        method: POST
        description: Reducto Cancel Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: job_id
          in: path
          type: string
          required: true
    - name: jobs
      path: /jobs
      operations:
      - name: listjobs
        method: GET
        description: Reducto List Jobs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      value: '{{env.REDUCTO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: jobs-jobs-rest
    port: 8080
    description: REST adapter for Reducto Jobs API — Jobs.
    resources:
    - path: /v1/job/{job_id}
      name: job
      operations:
      - method: GET
        name: getjob
        call: jobs-jobs.getjob
        with:
          job_id: rest.path.job_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/cancel/{job_id}
      name: cancel
      operations:
      - method: POST
        name: canceljob
        call: jobs-jobs.canceljob
        with:
          job_id: rest.path.job_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/jobs
      name: jobs
      operations:
      - method: GET
        name: listjobs
        call: jobs-jobs.listjobs
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: jobs-jobs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Reducto Jobs API — Jobs.
    tools:
    - name: reducto-get-job
      description: Reducto Get Job
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: jobs-jobs.getjob
      with:
        job_id: tools.job_id
      outputParameters:
      - type: object
        mapping: $.
    - name: reducto-cancel-job
      description: Reducto Cancel Job
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: jobs-jobs.canceljob
      with:
        job_id: tools.job_id
      outputParameters:
      - type: object
        mapping: $.
    - name: reducto-list-jobs
      description: Reducto List Jobs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: jobs-jobs.listjobs
      outputParameters:
      - type: object
        mapping: $.
