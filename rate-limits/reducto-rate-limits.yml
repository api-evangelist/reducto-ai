specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
generated: '2026-09-17'
method: searched
source: https://docs.reducto.ai/reference/rate-limits
provider: Reducto
providerId: reducto-ai
created: '2026-05-25'
modified: '2026-09-17'
reconciled: true
tags:
  - Rate Limiting
  - Quotas
  - Document AI
description: >-
  Published rate limits for the Reducto API, re-read from docs.reducto.ai/reference/rate-limits on
  2026-09-17. Reducto now documents TWO independent mechanisms and is explicit that they are
  different things: edge rate limits cap requests per second and reject with 429 at the ingress,
  while a separate per-account concurrency throttle queues parallel parse work and eventually
  returns 200 after a wait. The per-tier "sync RPS" figures this file previously carried
  (1/10/100 RPS by plan, 200 concurrent) no longer appear in the rate-limits documentation and
  have been replaced by the per-API-key caps below; the tier-dependent behaviour now lives in the
  concurrency throttle instead.
sources:
  - https://docs.reducto.ai/reference/rate-limits
  - https://docs.reducto.ai/reference/throttling
  - https://docs.reducto.ai/reference/error-codes
responseCodes:
  throttled: 429
  quotaExceeded: 429
responseHeaders:
  published: false
  note: >-
    Reducto publishes NO rate-limit response headers. No X-RateLimit-*, no RFC 9239 RateLimit-*,
    and no Retry-After is documented, and none appears in the OpenAPI at
    platform.reducto.ai/openapi.json. The only runtime signal is the 429 status plus a
    "[CODE 1000]" or "[CODE 2000]" marker embedded in a prose message string in the JSON body, so
    a client must string-match to tell which limit it hit and can never see its remaining budget
    before being refused.
algorithm: per-API-key requests-per-second at the edge, plus a separate per-account concurrency throttle
limits:
  - scope: per-api-key
    endpoints: all
    limit: 1000
    unit: requests
    window: second
    sustained: true
    responseStatus: 429
    responseBody: '{"message": "[CODE 1000] rate limit exceeded, retry with exponential backoff"}'
    remediation: Slow the submission rate or split traffic across API keys.
  - scope: per-api-key
    endpoints:
      - GET /job/{job_id}
    limit: 200
    unit: requests
    window: second
    sustained: true
    responseStatus: 429
    responseBody: '{"message": "[CODE 2000] rate limit exceeded, please use webhooks instead of polling"}'
    remediation: Switch to webhooks instead of polling job status.
  - scope: infrastructure
    endpoints: all
    limit: null
    window: null
    responseStatus: 429
    responseBody: 'no [CODE ...] marker'
    note: Rare application-layer shed under load. Not a normal-operation signal; retry with backoff.
limit_count: 3
concurrencyThrottle:
  mechanism: queues parallel parse work per account rather than rejecting it
  behaviorOnExceeded: work queues until a slot frees, then runs
  returns: 200 (after wait)
  symptom: slow P90 latency with no 4xx, or a sync request hanging near the 900-second timeout
  docs: https://docs.reducto.ai/reference/throttling
timeouts:
  syncRequestSeconds: 900
  note: A sync call approaching the 15-minute ceiling should be moved to an async endpoint.
retryGuidance: >-
  The official Python, Node and Go SDKs retry 408, 409, 429 and all 5xx automatically — two
  retries by default, exponential backoff with jitter, one-hour per-request timeout. Because
  Reducto documents no idempotency key, an automatically retried POST can be billed more than once.
