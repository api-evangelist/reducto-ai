        type: OpenAPI
    description: >-
      Configure webhook endpoints for asynchronous job completion. Supports direct webhooks and Svix-backed delivery,
      plus a hosted Webhook Portal for end-customer subscription management.
  - aid: reducto-ai:reducto-platform-api
    name: Reducto Platform API
    tags:
