position: Consuming
description: >-
  Reducto is an AI document-parsing platform that turns unstructured PDFs, images, spreadsheets, slides, and forms into
  LLM-ready layout, structured data, and form completions. The API exposes Parse, Extract, Split, Edit, Classify, and
  Pipeline endpoints — each with sync and async variants — plus an Upload API, Webhooks API, and Jobs API. Used by Scale
  AI, Vanta, Harvey, Medallion, Toast, JLL, Vise, Newfront, and Legora to power document AI in finance, healthcare,
  insurance, legal, government, and logistics.
