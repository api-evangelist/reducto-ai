  - type: Features
    data:
      - >-
        Parse — agentic OCR with error correction, layout-aware extraction across 30+ file types (PDFs, images,
        spreadsheets, slides, Office docs, text)
      - >-
        Extract — schema-driven structured data extraction with Deep Extract, Array Extract, and Citations that pin
        fields to source page + bounding box
      - Split — automatic separation of multi-document files and long forms via rules-based Split or Deep Split
      - Edit — template-free form filling for blanks, tables, and checkboxes from a form schema (beta)
      - Classify — page-context document classification with optional citations
      - Pipeline — single-call composition of Parse + Split + Extract + Edit + Classify with chained outputs
      - Cite — citation lookup endpoint surfacing source-level references inside parsed content
      - >-
        Async endpoints (parse_async, extract_async, split_async, edit_async, pipeline_async) plus a Jobs API for
        retrieve, cancel, and list
      - Direct webhooks and Svix-backed webhooks for async completion, with a hosted Webhook Portal
      - Upload API with large-file chunked uploads producing reducto:// references reusable across endpoints
      - jobid:// references that let Extract / Split / Edit reuse a prior Parse without re-billing
      - Multilingual parsing across 100+ languages with automatic page rotation
      - Intelligent chunking (variable, section, page, block) optimized for LLM/embedding pipelines
      - Figure summarization, chart extraction, equation handling, list detection, and discardable-block tagging
      - Spreadsheet parsing with table splitting, cell colors, formulas, and clustering modes
      - Table output formats — HTML, JSON, Markdown, CSV, and AI-JSON
      - Studio — visual workbench for Parse, Split, Extract, Edit, and Pipeline deployment
      - Studio Deploy Pipeline — push designed workflows directly to production
      - Official SDKs in Python, Node.js, and Go plus a Reducto CLI
      - Reducto MCP Server for agent integration
      - LLMs Center (llms.reducto.ai) and llms.txt for AI-agent friendly documentation
      - >-
        Hybrid VPC and on-premise deployment options (AWS, Azure, GCS, Box) with database, OCR, LLM, fair-queueing,
        observability, and file-cleanup configuration
      - EU data residency endpoints on Growth+
      - Zero-data-retention option and Business Associate Agreement on Growth+
      - >-
        Token-style rate limits — 200 concurrent sync requests, 500 RPS submission; tiered per-second sync rate (1 RPS
        Standard, 10 RPS Growth, 100+ RPS Enterprise)
      - >-
        Credit-based pricing — Parse 1-4 credits/page, Extract 2 credits/page (Deep Extract 4 + 0.1/field, min 30),
        Split 2-4 credits/page, Edit 4 credits/page, Classify 0.5 credits/page-of-context
      - 15,000 free credits on the Standard plan, then $0.015 per credit
    sources:
      - https://reducto.ai
      - https://docs.reducto.ai/overview
      - https://docs.reducto.ai/reference/credit-usage
      - https://docs.reducto.ai/reference/rate-limits
      - https://reducto.ai/pricing
    updated: '2026-05-25'
  - type: UseCases
    data:
      - name: Financial document analysis
        description: >-
          Parse 10-Ks, prospectuses, KBYC packets, broker statements, and credit memos to extract tables, line items,
          and structured financials for downstream analytics or LLM agents.
      - name: Insurance claims and underwriting
        description: >-
          Split multi-document claim packets, classify each unit (police report, medical record, photo, ACORD form), and
          extract structured fields with citations for adjuster review.
      - name: Healthcare records processing
        description: >-
          Extract structured patient, encounter, lab, and medication data from scanned EOBs, charts, and faxes under a
          BAA with zero data retention.
      - name: Legal contract review
        description: >-
          Surface redlined clauses, defined terms, and obligation language from redlined contracts and case files with
          field-level citations back to the source page.
      - name: Government and public-sector forms
        description: >-
          Fill, extract, and classify long-form government applications, permits, and disclosure filings using the Edit
          and Pipeline APIs.
      - name: Logistics, supply chain, and trade
        description: >-
          Parse invoices, BOLs, customs forms, certificates of origin, and packing lists in bulk to feed ERP and TMS
          systems.
      - name: Identity verification
        description: >-
          Extract and validate fields from passports, IDs, and proof-of-address documents using the Identity
          Verification cookbook.
      - name: Invoice and AP automation
        description: >-
          Capture vendor, line-item, and tax data from invoices with citations to source bounding boxes for review and
          approval.
      - name: Multilingual document processing
        description: Parse and extract from documents in 100+ languages with consistent schemas.
      - name: Multimodal RAG ingestion
        description: >-
          Produce LLM-optimized chunks (with figure summarization, embed strings, and bounding boxes) ready for vector
          indexing.
    sources:
      - https://reducto.ai
      - https://docs.reducto.ai/cookbooks/overview
    updated: '2026-05-25'
  - type: Integrations
    data:
      - name: AWS S3 / Hybrid VPC on AWS
        description: Presigned S3 URLs as parse inputs, plus hybrid VPC deployment on AWS for on-prem-grade isolation.
      - name: Azure / Hybrid VPC on Azure
        description: Hybrid VPC deployment on Azure for regulated workloads.
      - name: Google Cloud / Hybrid VPC on GCS
        description: Hybrid VPC deployment on GCS for regulated workloads.
      - name: Box / Hybrid VPC on Box
        description: Pull documents from Box for parsing in a hybrid VPC topology.
      - name: Browserbase
        description: Web-browsing cookbook that pairs Browserbase with Reducto for live web-document capture.
      - name: Svix
        description: Webhook delivery and management via Svix-backed webhook portals.
      - name: Model Context Protocol (MCP)
        description: Reducto MCP Server exposes Parse / Extract / Split / Edit / Classify as MCP tools to AI agents.
      - name: OpenAPI tooling
        description: Public OpenAPI 3.1 spec at docs.reducto.ai/openapi.json plus a legacy spec for backwards compatibility.
    sources:
      - https://docs.reducto.ai
      - https://docs.reducto.ai/onprem/enterprise_deployment_options
    updated: '2026-05-25'
  - type: Solutions
    data:
      - name: Standard
        description: Pay-as-you-go credit plan, 15,000 free credits, then $0.015/credit; 1 RPS sync; up to 5 Studio seats.
      - name: Growth
        description: >-
          Volume-discounted plan adding zero-data-retention, BAA, 10 RPS sync, up to 5 active priority requests, EU data
          residency, priority support, and unlimited Studio seats.
      - name: Enterprise
        description: >-
          Adds VPC and on-premises deployment, custom MSA/SLA, dedicated support, RBAC, SSO/SAML, and 100+ RPS custom
          throughput.
    sources:
      - https://reducto.ai/pricing
    updated: '2026-05-25'
