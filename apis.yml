apis:
  - aid: reducto-ai:reducto-parse-api
    name: Reducto Parse API
    tags:
      - Document AI
      - Parse
      - OCR
      - LLM
      - PDF
    humanURL: https://docs.reducto.ai/parse/overview
    properties:
      - url: https://docs.reducto.ai/parse/overview
        type: Documentation
      - url: https://docs.reducto.ai/api-reference/parse
        type: APIReference
      - url: https://docs.reducto.ai/api-reference/async-parse
        type: APIReference
      - url: https://docs.reducto.ai/parse/response-format
        type: Documentation
      - url: https://docs.reducto.ai/parse/best-practices
        type: Documentation
      - url: openapi/reducto-parse-api-openapi.yml
        type: OpenAPI
      - url: json-schema/reducto-parse-schema.json
        type: JSONSchema
      - url: json-ld/reducto-context.jsonld
        type: JSONLD
    description: >-
      Parse documents (PDFs, images, spreadsheets, slides, text files) and capture layout, structure, OCR text, tables,
      figures, equations, lists, and LLM-optimized chunks. Supports agentic OCR with error correction, intelligent
      ordering, figure summarization, embedding optimization, automatic page rotation, multilingual processing across
      100+ languages, and synchronous or asynchronous execution.
  - aid: reducto-ai:reducto-extract-api
    name: Reducto Extract API
    tags:
      - Document AI
      - Extract
      - Structured Data
      - JSON Schema
    humanURL: https://docs.reducto.ai/extract/overview
    properties:
      - url: https://docs.reducto.ai/extract/overview
        type: Documentation
      - url: https://docs.reducto.ai/api-reference/extract
        type: APIReference
      - url: https://docs.reducto.ai/api-reference/extract-async
        type: APIReference
      - url: https://docs.reducto.ai/extract/response-format
        type: Documentation
      - url: https://docs.reducto.ai/extraction/best-practices-extract
        type: Documentation
      - url: https://docs.reducto.ai/configs/extract/deep-extract
        type: Documentation
      - url: https://docs.reducto.ai/configs/extract/array-extraction
        type: Documentation
      - url: https://docs.reducto.ai/configs/extract/citations
        type: Documentation
      - url: openapi/reducto-extract-api-openapi.yml
        type: OpenAPI
      - url: json-schema/reducto-extract-schema.json
        type: JSONSchema
    description: >-
      Extract structured data from documents using a caller-supplied JSON Schema. Supports Deep Extract for harder
      documents, Array Extract for repeating sections, and Citations that pin each extracted field to a page and
      bounding box in the source document.
  - aid: reducto-ai:reducto-split-api
    name: Reducto Split API
    tags:
      - Document AI
      - Split
      - Document Classification
    humanURL: https://docs.reducto.ai/split
    properties:
      - url: https://docs.reducto.ai/split
        type: Documentation
      - url: https://docs.reducto.ai/api-reference/split
        type: APIReference
      - url: https://docs.reducto.ai/api-reference/split-async
        type: APIReference
      - url: https://docs.reducto.ai/configs/split/configuration
        type: Documentation
      - url: https://docs.reducto.ai/configs/split/deep-split
        type: Documentation
      - url: openapi/reducto-split-api-openapi.yml
        type: OpenAPI
    description: >-
      Automatically separate multi-document files and long forms into individual logical units using rules-based Split
      or Deep Split, then route each unit to downstream Parse, Extract, or Edit operations inside a Pipeline.
  - aid: reducto-ai:reducto-edit-api
    name: Reducto Edit API
    tags:
      - Document AI
      - Edit
      - Forms
      - Form Filling
    humanURL: https://docs.reducto.ai/editing/edit-overview
    properties:
      - url: https://docs.reducto.ai/editing/edit-overview
        type: Documentation
      - url: https://docs.reducto.ai/api-reference/edit
        type: APIReference
      - url: https://docs.reducto.ai/api-reference/edit-async
        type: APIReference
      - url: https://docs.reducto.ai/configs/edit/form-schema
        type: Documentation
      - url: openapi/reducto-edit-api-openapi.yml
        type: OpenAPI
    description: >-
      Fill detected blanks, tables, and checkboxes inside documents from a provided form schema, without requiring
      per-document templates. Beta endpoint priced at 4 credits per page.
  - aid: reducto-ai:reducto-pipeline-api
    name: Reducto Pipeline API
    tags:
      - Document AI
      - Workflow
      - Pipeline
    humanURL: https://docs.reducto.ai/workflows/pipeline-basics
    properties:
      - url: https://docs.reducto.ai/workflows/pipeline-basics
        type: Documentation
      - url: https://docs.reducto.ai/api-reference/pipeline
        type: APIReference
      - url: https://docs.reducto.ai/api-reference/pipeline-async
        type: APIReference
      - url: https://docs.reducto.ai/workflows/multi-document-pipelines
        type: Documentation
      - url: https://docs.reducto.ai/workflows/chaining-endpoints
        type: Documentation
      - url: openapi/reducto-pipeline-api-openapi.yml
        type: OpenAPI
    description: >-
      Compose Parse, Split, Extract, Edit, and Classify into a single multi-step workflow with chained outputs. Supports
      priority requests on Growth, and on-premise / VPC deployments on Enterprise.
  - aid: reducto-ai:reducto-classify-api
    name: Reducto Classify API
    tags:
      - Document AI
      - Classify
      - Document Classification
      - Citations
    humanURL: https://docs.reducto.ai/classify/overview
    properties:
      - url: https://docs.reducto.ai/classify/overview
        type: Documentation
      - url: https://docs.reducto.ai/classify/best-practices
        type: Documentation
      - url: https://docs.reducto.ai/classify/response-format
