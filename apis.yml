    description: >-
      Retrieve, cancel, and list async jobs created by parse_async, extract_async, split_async, edit_async, and
      pipeline_async. Pairs with direct or Svix-backed webhooks for completion notifications.
  - aid: reducto-ai:reducto-upload-api
    name: Reducto Upload API
    tags:
      - Document AI
      - Upload
      - Storage
    humanURL: https://docs.reducto.ai/upload/overview
    properties:
