      - url: openapi/reducto-classify-api-openapi.yml
        type: OpenAPI
    description: >-
      Classify documents into a defined set of categories and run citation lookups against parsed content. Billed at 0.5
      credits per page of context (default 5 pages = 2.5 credits per document).
  - aid: reducto-ai:reducto-jobs-api
    name: Reducto Jobs API
    tags:
