method: searched
source: https://docs.reducto.ai/reference/version-pinning, https://docs.reducto.ai/reference/model-versions,
  https://status.reducto.ai/api/v2/status.json, https://docs.reducto.ai/onprem/changelog,
  https://platform.reducto.ai/openapi.json
provider: Reducto
providerId: reducto-ai
versioning:
  api_versioning: none
  note: >-
    There is no version segment in the URL and no version header. Every operation sits at the root
    of https://platform.reducto.ai. The spec's info.version is a build string
    (v1.12.16-40-g42081c3db472 on 2026-09-17) that moves continuously; GET /version returns the
    running build. What Reducto actually versions is the MODEL behind each endpoint, not the
    endpoint itself.
  model_versioning:
    mechanism: request-scoped pinning via the settings.alpha config (top-level `alpha` for split)
    stages: [alpha, default, deprecated, removed]
    rollout_window: 4 weeks — 2 weeks alpha opt-in before a version becomes default, 2 weeks
      pinnable after it is demoted
    docs: https://docs.reducto.ai/reference/version-pinning
    register: https://docs.reducto.ai/reference/model-versions
    caveat: >-
      Reducto is deployed as a monolith, so frozen snapshots of previous versions are not
      available outside on-prem/VPC deployments. Pinning during the rollout window is the only
      supported mechanism for managing behavioural change.
deprecation:
  policy: true
  docs: https://docs.reducto.ai/reference/version-pinning
  register: https://docs.reducto.ai/reference/model-versions
  sunset_headers: false
  sunset_header_note: RFC 8594 Sunset/Deprecation response headers are not documented and do not
    appear in the OpenAPI.
  deprecated_operations_in_spec: 0
  deprecated_model_versions:
  - component: Layout
    version: v2
    status: deprecated
    removal_date: '2026-07-22'
    pin: '{"alpha": {"layout_model": "v2"}}'
  - component: Layout
    version: v1
    status: deprecated
    removal_date: '2026-05-06'
    pin: '{"alpha": {"layout_model": "v1"}}'
  - component: Extract
    version: v2
    status: deprecated
    removal_date: '2027-01-04'
    pin: '{"alpha": {"extract_model": "v2"}}'
  - component: Key-Value
    version: v2
    status: deprecated
    removal_date: '2026-07-23'
    pin: '{"alpha": {"key_value_model": "v2"}}'
  - component: Deep Extract
    version: v2
    status: deprecated
    removal_date: '2026-09-03'
    pin: '{"alpha": {"deep_extract_model": "v2"}}'
  note: >-
    Every deprecated model version carries a dated removal, which is a stronger and more specific
    deprecation signal than most providers publish. Note that three of the five removal dates
    above are already in the past as of 2026-09-17 while the register still lists them as
    deprecated rather than removed.
status_page:
