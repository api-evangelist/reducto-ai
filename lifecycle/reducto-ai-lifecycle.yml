  note: No public SLA document. The pricing page reserves custom MSA/SLA terms for the Enterprise
    tier; support tiers differ by plan (priority support on Growth and above).
changelog:
  public: partial
  urls:
  - url: https://docs.reducto.ai/onprem/changelog
    note: On-premise release notes. The page returns HTTP 200 but its body is a client-side
      password gate (SHA-256 challenge), so the entries are not publicly readable.
  - url: https://docs.reducto.ai/reference/model-versions
    note: The genuinely public dated register of what changed — current default, deprecated and
      removal dates per model component.
retention:
