source: live HTTP probes of every host in apis.yml, every OpenAPI servers[] host, the docs/console
  host, and the authorization_servers host named by the protected-resource document
provider: Reducto
providerId: reducto-ai
note: >-
  Reducto publishes an unusually complete discovery surface. The apex domain serves RFC 9116
  security.txt, an RFC 9727 api-catalog linkset, an agent card, and five further agent/MCP
  discovery documents that the linkset itself names. The OAuth protected-resource document lives
  on the console host (studio.reducto.ai) and points at a third host (accounts.reducto.ai) for the
  authorization server, which is where the authorization-server metadata actually resolves —
  probing only the primary domain would have missed both. platform.reducto.ai (the API host)
  returns 403 for every /.well-known/ path; docs.reducto.ai serves its own, separate agent card.
hosts:
