note: >-
  Reducto publishes no public dated changelog for its hosted API. The on-premise changelog at
  docs.reducto.ai/onprem/changelog returns HTTP 200 but its body is a client-side SHA-256 password
  gate, so its entries are not publicly readable. What IS public and dated is the model-version
  register, which names the current default for each model component and gives an explicit removal
  date for each deprecated one. That register is recorded below as the changelog surface, because
  it is the only place a consumer can see what changed and when it stops working.
